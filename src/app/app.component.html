<div class="app-shell" [class.no-nav]="!isAuthenticated()">
  @if (isAuthenticated()) {
    <aside class="sidebar">
      <div class="brand">
        <span class="logo">🥗</span>
        <span class="brand-name">NutriTrack</span>
      </div>
      <nav>
        @for (item of nav; track item.path) {
          <a [routerLink]="item.path" routerLinkActive="active" class="nav-link">
            <span class="nav-icon">{{ item.icon }}</span>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        }
      </nav>

      <div class="sidebar-foot">
        @if (!isSubscribed()) {
          <a routerLink="/setup" class="upgrade-link">⭐ Upgrade</a>
        }
        <button type="button" class="logout-btn" (click)="logout()">
          <span class="nav-icon">🚪</span>
          <span class="nav-label">Log Out</span>
        </button>
      </div>
    </aside>
  }

  <main class="content">
    <router-outlet />
  </main>

  @if (reminders.lastReminder(); as msg) {
    <div class="reminder-toast" role="status">
      <span>{{ msg }}</span>
      <button type="button" (click)="reminders.dismissToast()" aria-label="Dismiss">✕</button>
    </div>
  }
</div>
